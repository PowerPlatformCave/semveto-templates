name: secret-scan
# The second filter of this repository (50 v0.2 §8.6): a standard secret detector over the whole history, and the
# generic patterns over every file. No secret is used. A change that fails does not enter (branch protection).
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact --no-banner --exit-code 1
      - name: generic patterns
        run: |
          set -u
          P='[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|/subscription[s]/|[.]vault[.]azure[.]net|[.]blob[.]core[.]windows[.]net|[.]openai[.]azure[.]com|[.]cognitiveservices[.]azure[.]com|[.]azurecomm[.]net|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}'
          if grep -rInE "$P" --exclude-dir=.git --exclude-dir=.github . ; then echo "generic pattern found"; exit 1; fi
          if find . -path ./.git -prune -o \( -name '.env*' -o -name '*.parameters.json' \) -print | grep -q . ; then echo "env or parameters file"; exit 1; fi
          echo "clean"
