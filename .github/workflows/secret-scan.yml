name: secret-scan
# The second filter of this repository (50 v0.2 §8.6): a standard secret detector over the whole history, and the
# generic patterns over every file. No secret is used. A change that fails does not enter (branch protection).
# The public constants a template needs are removed before the patterns are applied: the GUIDs of the built-in
# roles it assigns (Storage Blob Data Contributor, Key Vault Secrets User, Cognitive Services OpenAI User).
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact --no-banner --verbose --exit-code 1
      - name: generic patterns
        run: |
          set -u
          ROLES='ba92f5b4-2d11-453d-a403-e96b0029c9fe|4633458b-17de-408a-b874-0445c86b69e6|5e0bd9bd-7b93-4f28-af87-19fc36ad61bd'
          P='[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|/subscription[s]/|[A-Za-z0-9-][.]vault[.]azure[.]net|[A-Za-z0-9-][.]blob[.]core[.]windows[.]net|[A-Za-z0-9-][.]openai[.]azure[.]com|[A-Za-z0-9-][.]cognitiveservices[.]azure[.]com|[A-Za-z0-9-][.]azurecomm[.]net|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]{2,}'
          found=0
          while IFS= read -r -d '' f; do
            if sed -E "s/$ROLES//g" "$f" | grep -nE "$P" > /dev/null; then echo "generic pattern in $f"; found=1; fi
          done < <(find . -type f -not -path './.git/*' -not -path './.github/*' -print0)
          if find . -path ./.git -prune -o \( -name '.env*' -o -name '*.parameters.json' \) -print | grep -q . ; then echo "env or parameters file"; found=1; fi
          [ "$found" = 0 ] && echo "clean"
          exit $found
